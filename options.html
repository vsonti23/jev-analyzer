<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="src/ui/app.css"><title>Job Sieve settings</title></head>
  <body><main class="settings"><h1>Job Sieve profile</h1><p>Job Sieve filters loaded listings locally before asking Jev to classify a full job description.</p><form id="profile-form"><fieldset><legend>Target profile</legend><label>Target roles<textarea name="targetRoles" placeholder="Senior Backend Engineer&#10;Platform Engineer"></textarea><small>One role per line.</small></label><label>Skills<textarea name="skills" placeholder="TypeScript&#10;Python&#10;AWS"></textarea><small>One skill per line.</small></label><label>Years of relevant experience<input name="yearsExperience" type="number" min="0" max="60" step="0.5"></label></fieldset><fieldset><legend>Hard filters</legend><label>Minimum match rating (0–10)<input name="minimumFit" type="number" min="0" max="10" step="0.5"></label><label>Maximum age in hours<input name="maxAgeHours" type="number" min="1" max="720" step="1"></label><label>Allowed locations<textarea name="allowedLocations" placeholder="San Francisco&#10;Remote"></textarea><small>Leave blank to allow all locations.</small></label><label class="checkbox"><input name="needsSponsorship" type="checkbox"> I need visa sponsorship now or in the future</label><label class="checkbox"><input name="hideSkipped" type="checkbox"> Hide skipped jobs after scanning</label></fieldset><fieldset><legend>Classifier connection</legend><label>Local backend URL<input name="backendUrl" type="url" placeholder="http://localhost:8787"></label><small>The Jev API key is held by the local backend and is never saved in this extension.</small></fieldset><div class="actions"><button type="submit">Save settings</button><span id="saved" role="status"></span></div></form></main><script type="module" src="src/ui/options.js"></script></body>
</html>
