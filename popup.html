<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="src/ui/app.css"><title>Job Sieve</title></head>
  <body><main class="popup"><header><h1>Job Sieve</h1><button id="settings" class="link">Profile & filters</button></header><p id="status">Ready to scan this page.</p><div class="actions"><button id="scan">Scan loaded jobs</button><button id="restore" class="secondary">Show skipped</button></div><dl class="stats" id="stats" hidden><div class="tile tile-loaded"><dt>Loaded</dt><dd id="loaded">0</dd></div><div class="tile tile-keep"><dt><i></i>Keep</dt><dd id="keep">0</dd></div><div class="tile tile-check"><dt><i></i>Check</dt><dd id="check">0</dd></div><div class="tile tile-skip"><dt><i></i>Skip</dt><dd id="skip">0</dd></div></dl><div class="legend" aria-label="Status legend"><span><i class="dot dot-keep"></i>Worth opening</span><span><i class="dot dot-check"></i>Needs review</span><span><i class="dot dot-skip"></i>Filtered out</span></div><p class="hint">Only jobs currently loaded in the page are scanned.</p></main><script type="module" src="src/ui/popup.js"></script></body>
</html>
